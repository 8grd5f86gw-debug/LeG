name: Build and deploy Windy plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windy plugin
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site
          cp dist/plugin.js _site/plugin.js
          cp dist/plugin.min.js _site/plugin.min.js
          cp dist/package.json _site/package.json
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head><meta charset="utf-8"><title>Windy Day/Night Plugin</title></head>
            <body>
              <h1>Windy Day/Night Plugin</h1>
              <p>Fichier Windy : <a href="plugin.js">plugin.js</a></p>
              <p>Version minifiée : <a href="plugin.min.js">plugin.min.js</a></p>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
